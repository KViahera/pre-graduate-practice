spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/platform_database
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_USERNAME:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

    hibernate:
      ddl-auto: update